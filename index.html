<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT PMO Kanban</title>
<style>
/* =========================================================
   1. DESIGN TOKENS — palette, spacing scale, type
   ========================================================= */
:root {
  /* Corporate blue palette */
  --blue-900: #0b2a5b;
  --blue-800: #10377a;
  --blue-700: #1450a3;
  --blue-600: #1a5fc4;
  --blue-100: #dbe7f8;
  --blue-50:  #eef4fc;

  /* Neutrals */
  --bg:       #f3f6fa;
  --surface:  #ffffff;
  --border:   #d6dee8;
  --text:     #1b2635;
  --muted:    #5a6779;

  /* Priority colours (border) + pill tints (bg / text) */
  --prio-critical: #c62828;  --prio-critical-bg: #fde8e8; --prio-critical-fg: #9b1c1c;
  --prio-high:     #d98a00;  --prio-high-bg:     #fff3d6; --prio-high-fg:     #7a4d00;
  --prio-medium:   #1a5fc4;  --prio-medium-bg:   #e3edfb; --prio-medium-fg:   #134a99;
  --prio-low:      #8a94a3;  --prio-low-bg:      #eceff3; --prio-low-fg:      #4a5463;

  /* Status / feedback */
  --danger:     #b42318;
  --danger-bg:  #fdecea;
  --success:    #146c43;
  --success-bg: #e6f4ec;
  --warn:       #8a5300;
  --warn-bg:    #fff4dc;

  /* Spacing scale */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;

  --radius-sm: 4px;
  --radius:    8px;
  --radius-lg: 12px;
  --shadow-sm: 0 1px 2px rgba(11, 42, 91, 0.08);
  --shadow:    0 4px 14px rgba(11, 42, 91, 0.12);
  --focus:     0 0 0 3px rgba(26, 95, 196, 0.45);

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

/* =========================================================
   2. BASE
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }

/* Visible focus ring everywhere */
:focus-visible { outline: none; box-shadow: var(--focus); }
.visually-hidden {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: var(--space-2);
  border: 1px solid transparent; border-radius: var(--radius);
  padding: var(--space-2) var(--space-4);
  font-weight: 600; cursor: pointer; background: var(--surface);
}
.btn-primary { background: var(--blue-600); color: #fff; }
.btn-primary:hover { background: var(--blue-700); }
.btn-primary:disabled { background: var(--prio-low); cursor: progress; }
.btn-ghost { border-color: var(--border); color: var(--blue-800); }
.btn-ghost:hover { background: var(--blue-50); }
.btn-on-dark { background: #fff; color: var(--blue-900); }
.btn-on-dark:hover { background: var(--blue-100); }

/* =========================================================
   3. HEADER + SUMMARY STRIP
   ========================================================= */
.app-header {
  background: linear-gradient(90deg, var(--blue-900), var(--blue-700));
  color: #fff;
  padding: var(--space-3) var(--space-5);
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4);
}
.wordmark { display: flex; align-items: baseline; gap: var(--space-2); }
.wordmark h1 { font-size: 20px; letter-spacing: 0.04em; font-weight: 800; }
.wordmark span { font-size: 12px; opacity: 0.8; }

.summary {
  display: flex; flex-wrap: wrap; gap: var(--space-2);
  list-style: none; margin: 0 auto 0 0; padding: 0;
}
.summary li {
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 999px;
  padding: 2px var(--space-3);
  font-size: 12px;
  white-space: nowrap;
}
.summary strong { font-size: 13px; margin-left: var(--space-1); }
.summary .is-overdue { background: rgba(198, 40, 40, 0.35); border-color: rgba(255, 180, 180, 0.5); }

/* =========================================================
   4. FILTER BAR
   ========================================================= */
main { flex: 1; padding: var(--space-4) var(--space-5) var(--space-5); }
.filters {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-3);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: var(--space-3) var(--space-4);
  margin-bottom: var(--space-4); box-shadow: var(--shadow-sm);
}
.filters h2 { font-size: 13px; color: var(--muted); align-self: center; margin-right: var(--space-2); }
.field-inline { display: flex; flex-direction: column; gap: 2px; }
.field-inline label { font-size: 12px; color: var(--muted); font-weight: 600; }
.field-inline input, .field-inline select { min-width: 170px; }
input[type="text"], input[type="date"], select, textarea {
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 6px var(--space-2); background: var(--surface);
}
input:focus-visible, select:focus-visible, textarea:focus-visible { border-color: var(--blue-600); }

/* =========================================================
   5. BOARD + COLUMNS
   ========================================================= */
.board {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--space-4);
  align-items: start;
}
.column {
  background: #e9eef5;
  border: 2px dashed transparent;
  border-radius: var(--radius-lg);
  padding: var(--space-3);
  min-height: 240px;
  transition: background 0.15s, border-color 0.15s;
}
.column.drop-target { background: var(--blue-50); border-color: var(--blue-600); }
.column-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--space-3); padding: 0 var(--space-1);
}
.column-header h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--blue-900); }
.count-badge {
  background: var(--blue-900); color: #fff; border-radius: 999px;
  font-size: 12px; font-weight: 700; min-width: 26px; text-align: center; padding: 1px var(--space-2);
}
.column[data-status="Blocked"] .count-badge { background: var(--prio-critical); }
.column[data-status="Done"] .count-badge { background: var(--success); }
.card-list { display: flex; flex-direction: column; gap: var(--space-3); min-height: 60px; }
.card-list:focus-visible { border-radius: var(--radius); }
.empty-col { color: var(--muted); font-size: 12px; text-align: center; padding: var(--space-4) 0; font-style: italic; }

/* =========================================================
   6. CARDS
   ========================================================= */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 5px solid var(--prio-low);
  border-radius: var(--radius);
  padding: var(--space-3);
  box-shadow: var(--shadow-sm);
  cursor: grab;
  position: relative;
}
.card:hover { box-shadow: var(--shadow); }
.card.dragging { opacity: 0.45; }
.card.prio-critical { border-left-color: var(--prio-critical); }
.card.prio-high     { border-left-color: var(--prio-high); }
.card.prio-medium   { border-left-color: var(--prio-medium); }
.card.prio-low      { border-left-color: var(--prio-low); }
.card.is-done .card-title { color: var(--muted); }

.card-top { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-1); }
.card-id { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; color: var(--muted); }
.badge-overdue {
  background: var(--danger-bg); color: var(--danger);
  border-radius: 999px; font-size: 11px; font-weight: 700; padding: 0 var(--space-2);
}
.icon-btn {
  margin-left: auto; border: 0; background: transparent; cursor: pointer;
  width: 26px; height: 26px; border-radius: var(--radius-sm);
  font-size: 18px; line-height: 1; color: var(--muted);
}
.icon-btn:hover { background: var(--danger-bg); color: var(--danger); }
.card-title { font-size: 14px; font-weight: 700; margin-bottom: 2px; word-break: break-word; }
.card-project { font-size: 12px; color: var(--blue-700); font-weight: 600; margin-bottom: var(--space-1); }
.card-desc {
  font-size: 12px; color: var(--muted); margin-bottom: var(--space-2);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-meta { display: grid; grid-template-columns: auto 1fr; gap: 0 var(--space-2); font-size: 12px; margin: 0 0 var(--space-2); }
.card-meta dt { color: var(--muted); }
.card-meta dd { margin: 0; }
.card-tags { display: flex; flex-wrap: wrap; gap: var(--space-1); align-items: center; }
.pill { border-radius: 999px; font-size: 11px; font-weight: 700; padding: 1px var(--space-2); }
.pill-critical { background: var(--prio-critical-bg); color: var(--prio-critical-fg); }
.pill-high     { background: var(--prio-high-bg);     color: var(--prio-high-fg); }
.pill-medium   { background: var(--prio-medium-bg);   color: var(--prio-medium-fg); }
.pill-low      { background: var(--prio-low-bg);      color: var(--prio-low-fg); }
.tag {
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 11px; padding: 0 var(--space-2); color: var(--muted);
}
.move-btn {
  margin-left: auto; border: 1px solid var(--border); background: var(--surface);
  border-radius: var(--radius-sm); font-size: 11px; font-weight: 600;
  padding: 1px var(--space-2); cursor: pointer; color: var(--blue-800);
}
.move-btn:hover, .move-btn[aria-expanded="true"] { background: var(--blue-50); border-color: var(--blue-600); }

/* Inline move menu */
.move-menu {
  display: flex; flex-wrap: wrap; gap: var(--space-1); align-items: center;
  margin-top: var(--space-2); padding-top: var(--space-2); border-top: 1px dashed var(--border);
}
.move-menu span { font-size: 11px; color: var(--muted); margin-right: var(--space-1); }
.move-menu button {
  border: 1px solid var(--blue-600); background: var(--blue-50); color: var(--blue-800);
  border-radius: var(--radius-sm); font-size: 11px; font-weight: 600; padding: 2px var(--space-2); cursor: pointer;
}
.move-menu button:hover { background: var(--blue-600); color: #fff; }

/* Inline delete confirm */
.delete-confirm {
  display: flex; align-items: center; gap: var(--space-2);
  margin-top: var(--space-2); padding: var(--space-2);
  background: var(--danger-bg); border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 600; color: var(--danger);
}
.delete-confirm button {
  border-radius: var(--radius-sm); font-size: 12px; font-weight: 700;
  padding: 2px var(--space-3); cursor: pointer; border: 1px solid var(--danger);
}
.delete-confirm .yes { background: var(--danger); color: #fff; }
.delete-confirm .no  { background: var(--surface); color: var(--danger); }

/* =========================================================
   7. ADD TASK MODAL + FORM
   ========================================================= */
dialog.modal {
  border: 0; border-radius: var(--radius-lg); padding: 0;
  width: min(560px, calc(100vw - 2 * var(--space-4)));
  box-shadow: 0 20px 50px rgba(11, 42, 91, 0.35);
}
dialog.modal::backdrop { background: rgba(11, 42, 91, 0.45); }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border);
}
.modal-head h2 { font-size: 17px; color: var(--blue-900); }
.modal-head .icon-btn { margin-left: 0; }
.modal-head .icon-btn:hover { background: var(--blue-50); color: var(--blue-900); }
.task-form { padding: var(--space-4) var(--space-5) var(--space-5); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3) var(--space-4); }
.form-field { display: flex; flex-direction: column; gap: var(--space-1); }
.form-field.full { grid-column: 1 / -1; }
.form-field label { font-weight: 600; font-size: 13px; }
.form-field .req { color: var(--danger); }
.form-field .hint { font-size: 11px; color: var(--muted); }
.form-field textarea { resize: vertical; min-height: 72px; }
.form-field [aria-invalid="true"] { border-color: var(--danger); background: #fffafa; }
.error { color: var(--danger); font-size: 12px; min-height: 0; }
.error:empty { display: none; }
.form-actions {
  display: flex; justify-content: flex-end; gap: var(--space-2);
  margin-top: var(--space-5);
}

/* =========================================================
   8. TOASTS + FOOTER NOTE
   ========================================================= */
.toast-region {
  position: fixed; right: var(--space-4); bottom: var(--space-4);
  display: flex; flex-direction: column; gap: var(--space-2);
  z-index: 100; max-width: min(380px, calc(100vw - 2 * var(--space-4)));
}
.toast {
  background: var(--surface); border-left: 5px solid var(--blue-600);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: var(--space-3) var(--space-4); font-weight: 600;
  animation: toast-in 0.2s ease-out;
}
.toast-success { border-left-color: var(--success); background: var(--success-bg); color: var(--success); }
.toast-warn    { border-left-color: var(--prio-high); background: var(--warn-bg); color: var(--warn); }
.toast-error   { border-left-color: var(--danger); background: var(--danger-bg); color: var(--danger); }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } .column { transition: none; } }

.demo-note {
  text-align: center; font-size: 12px; color: var(--muted);
  padding: var(--space-3) var(--space-4) var(--space-5);
}

/* =========================================================
   9. RESPONSIVE — stack columns below 768px
   ========================================================= */
@media (max-width: 767px) {
  .app-header { padding: var(--space-3) var(--space-4); }
  main { padding: var(--space-3) var(--space-4) var(--space-4); }
  .board { grid-template-columns: 1fr; }
  .column { min-height: 0; }
  .field-inline { flex: 1 1 140px; }
  .field-inline input, .field-inline select { min-width: 0; width: 100%; }
  .form-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- =========================================================
     HEADER — wordmark, live summary strip, Add Task button
     ========================================================= -->
<header class="app-header">
  <div class="wordmark">
    <h1>IT PMO</h1>
    <span>Project Board · Demo</span>
  </div>
  <ul class="summary" id="summary" aria-label="Task summary"></ul>
  <button type="button" class="btn btn-on-dark" id="openAddTask" aria-haspopup="dialog">
    <span aria-hidden="true">+</span> Add Task
  </button>
</header>

<main>
  <!-- =======================================================
       FILTER BAR — client-side filtering over in-memory state
       ======================================================= -->
  <section class="filters" aria-labelledby="filtersHeading">
    <h2 id="filtersHeading">Filter</h2>
    <div class="field-inline">
      <label for="filterProject">Project</label>
      <select id="filterProject"><option value="">All projects</option></select>
    </div>
    <div class="field-inline">
      <label for="filterAssignee">Assignee contains</label>
      <input type="text" id="filterAssignee" placeholder="e.g. Tan" autocomplete="off">
    </div>
    <div class="field-inline">
      <label for="filterPriority">Priority</label>
      <select id="filterPriority"><option value="">All priorities</option></select>
    </div>
    <button type="button" class="btn btn-ghost" id="clearFilters">Clear filters</button>
  </section>

  <!-- =======================================================
       KANBAN BOARD — four fixed columns, filled by renderBoard()
       ======================================================= -->
  <section class="board" id="board" aria-label="Kanban board">
    <section class="column" data-status="Backlog" aria-labelledby="col-backlog">
      <div class="column-header">
        <h2 id="col-backlog">Backlog</h2>
        <span class="count-badge" data-count></span>
      </div>
      <div class="card-list" data-list tabindex="-1"></div>
    </section>
    <section class="column" data-status="In Progress" aria-labelledby="col-progress">
      <div class="column-header">
        <h2 id="col-progress">In Progress</h2>
        <span class="count-badge" data-count></span>
      </div>
      <div class="card-list" data-list tabindex="-1"></div>
    </section>
    <section class="column" data-status="Blocked" aria-labelledby="col-blocked">
      <div class="column-header">
        <h2 id="col-blocked">Blocked</h2>
        <span class="count-badge" data-count></span>
      </div>
      <div class="card-list" data-list tabindex="-1"></div>
    </section>
    <section class="column" data-status="Done" aria-labelledby="col-done">
      <div class="column-header">
        <h2 id="col-done">Done</h2>
        <span class="count-badge" data-count></span>
      </div>
      <div class="card-list" data-list tabindex="-1"></div>
    </section>
  </section>
</main>

<p class="demo-note">
  Demo only. Board data lives in memory, so refreshing the page resets it to the sample tasks.
</p>

<!-- =========================================================
     ADD TASK MODAL
     ========================================================= -->
<dialog class="modal" id="addTaskModal" aria-labelledby="addTaskHeading">
  <div class="modal-head">
    <h2 id="addTaskHeading">Add Task</h2>
    <button type="button" class="icon-btn" id="closeAddTask" aria-label="Close add task form">×</button>
  </div>
  <form class="task-form" id="taskForm" novalidate>
    <div class="form-grid">
      <div class="form-field full">
        <label for="f-title">Task Title <span class="req" aria-hidden="true">*</span></label>
        <input type="text" id="f-title" name="title" maxlength="80" required aria-describedby="err-title">
        <p class="error" id="err-title"></p>
      </div>
      <div class="form-field full">
        <label for="f-description">Description <span class="hint">(optional, up to 500 characters)</span></label>
        <textarea id="f-description" name="description" maxlength="500" aria-describedby="err-description"></textarea>
        <p class="error" id="err-description"></p>
      </div>
      <div class="form-field">
        <label for="f-project">Project / Workstream <span class="req" aria-hidden="true">*</span></label>
        <select id="f-project" name="project" required aria-describedby="err-project"></select>
        <p class="error" id="err-project"></p>
      </div>
      <div class="form-field">
        <label for="f-category">Category <span class="req" aria-hidden="true">*</span></label>
        <select id="f-category" name="category" required aria-describedby="err-category"></select>
        <p class="error" id="err-category"></p>
      </div>
      <div class="form-field">
        <label for="f-assignee">Assignee <span class="req" aria-hidden="true">*</span></label>
        <input type="text" id="f-assignee" name="assignee" maxlength="60" required aria-describedby="err-assignee" autocomplete="off">
        <p class="error" id="err-assignee"></p>
      </div>
      <div class="form-field">
        <label for="f-priority">Priority</label>
        <select id="f-priority" name="priority" aria-describedby="err-priority"></select>
        <p class="error" id="err-priority"></p>
      </div>
      <div class="form-field">
        <label for="f-dueDate">Due Date <span class="req" aria-hidden="true">*</span></label>
        <input type="date" id="f-dueDate" name="dueDate" required aria-describedby="err-dueDate">
        <p class="error" id="err-dueDate"></p>
      </div>
      <div class="form-field">
        <label for="f-status">Status</label>
        <select id="f-status" name="status" aria-describedby="err-status"></select>
        <p class="error" id="err-status"></p>
      </div>
    </div>
    <div class="form-actions">
      <button type="button" class="btn btn-ghost" id="cancelAddTask">Close</button>
      <button type="submit" class="btn btn-primary" id="submitTask">Add Task</button>
    </div>
  </form>
</dialog>

<!-- Toast region: announced politely to screen readers -->
<div class="toast-region" id="toastRegion" role="status" aria-live="polite"></div>

<!--
  =========================================================
  FORMSUBMIT CONFIG: read before use
  ---------------------------------------------------------
  FormSubmit (formsubmit.co) needs a one-time activation.
  The FIRST submission to a new address doesn't deliver a
  task email. Instead FormSubmit sends a confirmation email
  to that address. Emails are only delivered after someone
  clicks the activation link in it.
  Change the address in FORMSUBMIT_ENDPOINT below (one place).
  =========================================================
-->
<script>
"use strict";

/* =========================================================
   CONFIG: change the email address here, in one place only
   ========================================================= */
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";
const TASK_ID_PREFIX = "ITPM-";               // Task ID format: PREFIX + zero-padded counter
const NOTIFY_SUBJECT_TAG = "[IT PMO]";   // Email subject prefix
const TOAST_DURATION_MS = 4500;

/* =========================================================
   CONSTANTS: fixed lists for columns and form options
   ========================================================= */
const STATUSES   = ["Backlog", "In Progress", "Blocked", "Done"];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];
const PROJECTS   = [
  "Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift",
  "Data & Analytics", "Infrastructure & Cloud", "Vendor Management"
];
const CATEGORIES = [
  "Application Development", "Infrastructure", "Cybersecurity",
  "Data", "Compliance", "Vendor"
];

/* =========================================================
   STATE: the single source of truth (memory only, no storage)
   ========================================================= */
const state = {
  tasks: [],
  filters: { project: "", assignee: "", priority: "" },
  nextId: 1,
  pendingDeleteId: null,   // card currently showing "Delete? Yes / No"
  openMoveId: null,        // card currently showing the Move menu
  focusAfterRender: null   // { id, action } or { list: status }: restores keyboard focus
};

/* =========================================================
   UTILITIES
   ========================================================= */

/** Escape a string for safe insertion into HTML text or attribute values. */
function escapeHtml(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/** Local-date ISO string (YYYY-MM-DD), optionally offset by N days. */
function todayISO(offsetDays) {
  const d = new Date();
  d.setDate(d.getDate() + (offsetDays || 0));
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + mm + "-" + dd;
}

/** Overdue = due date strictly before today and not Done. ISO strings compare lexically. */
function isOverdue(task) {
  return task.status !== "Done" && task.dueDate < todayISO();
}

/** Build a task ID like ITPM-0009. */
function formatId(n) {
  return TASK_ID_PREFIX + String(n).padStart(4, "0");
}

/** Format YYYY-MM-DD as "04 Nov 2026" without timezone shifting. */
function formatDate(iso) {
  const parts = String(iso).split("-").map(Number);
  if (parts.length !== 3 || parts.some(isNaN)) return iso;
  return new Date(parts[0], parts[1] - 1, parts[2])
    .toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
}

/** Lower-case slug for CSS class names (e.g. "Critical" → "critical"). */
function slug(value) {
  return String(value).toLowerCase().replace(/[^a-z0-9]+/g, "-");
}

/** Fill a <select> with options (values are constants, still escaped). */
function fillSelect(select, values, selected) {
  select.insertAdjacentHTML("beforeend", values.map(function (v) {
    return '<option value="' + escapeHtml(v) + '"' + (v === selected ? " selected" : "") + ">" +
      escapeHtml(v) + "</option>";
  }).join(""));
}

/* =========================================================
   SEED DATA: 8 demo tasks. Due dates are relative to today,
   so the board always shows a realistic mix (incl. overdue).

    { title: "Migrate FX pricing service to AWS",

      project: "Digital Channels", category: "Application Development", assignee: "Mei Ling Goh",

      project: "Core Banking Upgrade", category: "Application Development", assignee: "Arjun Mehta",

/* =========================================================
   RENDERING: everything on the board is rebuilt from state
   ========================================================= */

/** Pure filter over the in-memory array. */
function applyFilters(tasks) {
  const f = state.filters;
  const needle = f.assignee.trim().toLowerCase();
  return tasks.filter(function (t) {
    if (f.project && t.project !== f.project) return false;
    if (f.priority && t.priority !== f.priority) return false;
    if (needle && t.assignee.toLowerCase().indexOf(needle) === -1) return false;
    return true;
  });
}

/** Return the HTML string for one card. All task fields are escaped. */
function renderCard(task) {
  const id = escapeHtml(task.id);
  const title = escapeHtml(task.title);
  const prio = slug(task.priority);
  const overdue = isOverdue(task);

  const overdueBadge = overdue
    ? '<span class="badge-overdue"><span aria-hidden="true">⚠ </span>Overdue</span>'
    : "";

  const description = task.description
    ? '<p class="card-desc">' + escapeHtml(task.description) + "</p>"
    : "";

  let moveMenu = "";
  if (state.openMoveId === task.id) {
    moveMenu = '<div class="move-menu" role="group" aria-label="Move ' + title + ' to column">' +
      "<span>Move to:</span>" +
      STATUSES.filter(function (s) { return s !== task.status; }).map(function (s) {
        return '<button type="button" data-action="move-to" data-status="' + escapeHtml(s) + '">' +
          escapeHtml(s) + "</button>";
      }).join("") +
      "</div>";
  }

  let deleteConfirm = "";
  if (state.pendingDeleteId === task.id) {
    deleteConfirm = '<div class="delete-confirm" role="group" aria-label="Confirm delete">' +
      "<span>Delete?</span>" +
      '<button type="button" class="yes" data-action="delete-yes">Yes</button>' +
      '<button type="button" class="no" data-action="delete-no">No</button>' +
      "</div>";
  }

  return '<article class="card prio-' + prio + (task.status === "Done" ? " is-done" : "") + '"' +
    ' draggable="true" data-id="' + id + '" aria-label="' + id + ": " + title + '">' +
      '<div class="card-top">' +
        '<span class="card-id">' + id + "</span>" + overdueBadge +
        '<button type="button" class="icon-btn" data-action="delete" aria-label="Delete task ' + id + '">×</button>' +
      "</div>" +
      '<h3 class="card-title">' + title + "</h3>" +
      '<p class="card-project">' + escapeHtml(task.project) + "</p>" +
      description +
      '<dl class="card-meta">' +
        "<dt>Assignee</dt><dd>" + escapeHtml(task.assignee) + "</dd>" +
        "<dt>Due</dt><dd><time datetime=\"" + escapeHtml(task.dueDate) + "\">" +
          escapeHtml(formatDate(task.dueDate)) + "</time></dd>" +
      "</dl>" +
      '<div class="card-tags">' +
        '<span class="pill pill-' + prio + '">' + escapeHtml(task.priority) + "</span>" +
        '<span class="tag">' + escapeHtml(task.category) + "</span>" +
        '<button type="button" class="move-btn" data-action="move-toggle"' +
          ' aria-expanded="' + (state.openMoveId === task.id) + '"' +
          ' aria-label="Move task ' + id + ' to another column">Move ▸</button>' +
      "</div>" +
      moveMenu + deleteConfirm +
    "</article>";
}

/** Render the live summary strip (always over ALL tasks, not the filtered set). */
function renderSummary() {
  const counts = {};
  STATUSES.forEach(function (s) { counts[s] = 0; });
  let overdue = 0;
  state.tasks.forEach(function (t) {
    counts[t.status] = (counts[t.status] || 0) + 1;
    if (isOverdue(t)) overdue++;
  });
  const items = ['<li>Total<strong>' + state.tasks.length + "</strong></li>"]
    .concat(STATUSES.map(function (s) {
      return "<li>" + escapeHtml(s) + "<strong>" + counts[s] + "</strong></li>";
    }))
    .concat(['<li class="is-overdue"><span aria-hidden="true">⚠ </span>Overdue<strong>' + overdue + "</strong></li>"]);
  document.getElementById("summary").innerHTML = items.join("");
}

/** Rebuild every column from state, update counts and summary, then restore focus. */
function renderBoard() {
  const visible = applyFilters(state.tasks);
  const filtering = visible.length !== state.tasks.length;

  document.querySelectorAll(".column").forEach(function (col) {
    const status = col.dataset.status;
    const colTasks = visible.filter(function (t) { return t.status === status; });
    const totalInCol = state.tasks.filter(function (t) { return t.status === status; }).length;
    const list = col.querySelector("[data-list]");
    const badge = col.querySelector("[data-count]");

    list.innerHTML = colTasks.length
      ? colTasks.map(renderCard).join("")
      : '<p class="empty-col">' + (filtering && totalInCol ? "No tasks match the filters" : "No tasks") + "</p>";

    badge.textContent = filtering ? colTasks.length + " / " + totalInCol : String(colTasks.length);
    badge.setAttribute("aria-label", filtering
      ? colTasks.length + " of " + totalInCol + " tasks shown"
      : colTasks.length + " tasks");
  });

  renderSummary();
  restoreFocus();
}

/** Re-renders destroy the focused element, so put focus back where the user expects it. */
function restoreFocus() {
  const target = state.focusAfterRender;
  state.focusAfterRender = null;
  if (!target) return;
  let el = null;
  if (target.id) {
    const card = document.querySelector('.card[data-id="' + CSS.escape(target.id) + '"]');
    if (card) el = target.action ? card.querySelector('[data-action="' + target.action + '"]') : card;
  }
  if (!el && target.list) {
    const col = document.querySelector('.column[data-status="' + CSS.escape(target.list) + '"]');
    if (col) el = col.querySelector("[data-list]");
  }
  if (el) el.focus();
}

/* =========================================================
   STATE MUTATIONS: change state, then re-render
   ========================================================= */

/** Add a new task built from validated form data. Returns the created task. */
function addTask(data) {
  const task = {
    id: formatId(state.nextId++),
    title: data.title,
    description: data.description,
    project: data.project,
    category: data.category,
    assignee: data.assignee,
    priority: data.priority,
    dueDate: data.dueDate,
    status: data.status
  };
  state.tasks.push(task);
  renderBoard();
  return task;
}

/** Move a task to another column (status). */
function moveTask(id, newStatus) {
  const task = state.tasks.find(function (t) { return t.id === id; });
  if (!task || STATUSES.indexOf(newStatus) === -1) return;
  const changed = task.status !== newStatus;
  task.status = newStatus;
  state.openMoveId = null;
  renderBoard();
  if (changed) showToast(task.id + " moved to " + newStatus, "info");
}

/** Remove a task from the array. */
function deleteTask(id) {
  const task = state.tasks.find(function (t) { return t.id === id; });
  if (!task) return;
  state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
  state.pendingDeleteId = null;
  state.focusAfterRender = { list: task.status };
  renderBoard();
  showToast(id + " deleted", "info");
}

/* =========================================================
   BOARD EVENTS: delegated clicks (delete, move menu)
   ========================================================= */
function handleBoardClick(e) {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const card = btn.closest(".card");
  if (!card) return;
  const id = card.dataset.id;

  switch (btn.dataset.action) {
    case "delete":
      state.pendingDeleteId = id;
      state.openMoveId = null;
      state.focusAfterRender = { id: id, action: "delete-no" };
      renderBoard();
      break;
    case "delete-no":
      state.pendingDeleteId = null;
      state.focusAfterRender = { id: id, action: "delete" };
      renderBoard();
      break;
    case "delete-yes":
      deleteTask(id);
      break;
    case "move-toggle": {
      const opening = state.openMoveId !== id;
      state.openMoveId = opening ? id : null;
      state.pendingDeleteId = null;
      state.focusAfterRender = { id: id, action: opening ? "move-to" : "move-toggle" };
      renderBoard();
      break;
    }
    case "move-to":
      state.focusAfterRender = { id: id, action: "move-toggle" };
      moveTask(id, btn.dataset.status);
      break;
  }
}

/** Escape closes an open Move menu or delete confirmation. */
function handleBoardKeydown(e) {
  if (e.key !== "Escape") return;
  const card = e.target.closest(".card");
  if (!card || (state.openMoveId === null && state.pendingDeleteId === null)) return;
  const wasDelete = state.pendingDeleteId === card.dataset.id;
  state.openMoveId = null;
  state.pendingDeleteId = null;
  state.focusAfterRender = { id: card.dataset.id, action: wasDelete ? "delete" : "move-toggle" };
  renderBoard();
}

/* =========================================================
   DRAG AND DROP: native HTML5 API
   ========================================================= */
function bindDragAndDrop() {
  const board = document.getElementById("board");

  board.addEventListener("dragstart", function (e) {
    const card = e.target.closest && e.target.closest(".card");
    if (!card) return;
    e.dataTransfer.setData("text/plain", card.dataset.id);
    e.dataTransfer.effectAllowed = "move";
    card.classList.add("dragging");
  });

  board.addEventListener("dragend", function (e) {
    const card = e.target.closest && e.target.closest(".card");
    if (card) card.classList.remove("dragging");
    clearDropTargets();
  });

  document.querySelectorAll(".column").forEach(function (col) {
    col.addEventListener("dragenter", function (e) {
      e.preventDefault();
      col.classList.add("drop-target");
    });
    col.addEventListener("dragover", function (e) {
      e.preventDefault();                 // required to allow a drop
      e.dataTransfer.dropEffect = "move";
      col.classList.add("drop-target");
    });
    col.addEventListener("dragleave", function (e) {
      // Only clear when the pointer actually leaves the column, not a child element
      if (!col.contains(e.relatedTarget)) col.classList.remove("drop-target");
    });
    col.addEventListener("drop", function (e) {
      e.preventDefault();
      clearDropTargets();
      const id = e.dataTransfer.getData("text/plain");
      if (id) moveTask(id, col.dataset.status);
    });
  });
}

function clearDropTargets() {
  document.querySelectorAll(".column.drop-target").forEach(function (c) {
    c.classList.remove("drop-target");
  });
}

/* =========================================================
   FILTER BAR
   ========================================================= */
function bindFilters() {
  const project = document.getElementById("filterProject");
  const assignee = document.getElementById("filterAssignee");
  const priority = document.getElementById("filterPriority");

  fillSelect(project, PROJECTS);
  fillSelect(priority, PRIORITIES);

  project.addEventListener("change", function () { state.filters.project = project.value; renderBoard(); });
  priority.addEventListener("change", function () { state.filters.priority = priority.value; renderBoard(); });
  assignee.addEventListener("input", function () { state.filters.assignee = assignee.value; renderBoard(); });

  document.getElementById("clearFilters").addEventListener("click", function () {
    project.value = ""; assignee.value = ""; priority.value = "";
    state.filters = { project: "", assignee: "", priority: "" };
    renderBoard();
  });
}

/* =========================================================
   ADD TASK FORM: modal, validation, submit
   ========================================================= */
const FIELDS = ["title", "description", "project", "category", "assignee", "priority", "dueDate", "status"];

function fieldEl(name) { return document.getElementById("f-" + name); }

function setFieldError(name, message) {
  const input = fieldEl(name);
  document.getElementById("err-" + name).textContent = message || "";
  if (message) input.setAttribute("aria-invalid", "true");
  else input.removeAttribute("aria-invalid");
}

function clearFormErrors() {
  FIELDS.forEach(function (n) { setFieldError(n, ""); });
}

/** Read and trim the form values. */
function readForm() {
  const data = {};
  FIELDS.forEach(function (n) { data[n] = fieldEl(n).value.trim(); });
  return data;
}

/** Validate form data. Returns { name: message } for each invalid field. */
function validateForm(data) {
  const errors = {};
  if (!data.title) errors.title = "Task title is required.";
  else if (data.title.length > 80) errors.title = "Title must be 80 characters or fewer.";

  if (data.description.length > 500) errors.description = "Description must be 500 characters or fewer.";

  if (PROJECTS.indexOf(data.project) === -1) errors.project = "Choose a project or workstream.";
  if (CATEGORIES.indexOf(data.category) === -1) errors.category = "Choose a category.";

  if (!data.assignee) errors.assignee = "Assignee is required.";

  if (PRIORITIES.indexOf(data.priority) === -1) errors.priority = "Choose a priority.";

  if (!data.dueDate) errors.dueDate = "Due date is required.";
  else if (!/^\d{4}-\d{2}-\d{2}$/.test(data.dueDate)) errors.dueDate = "Enter a valid date.";
  else if (data.dueDate < todayISO()) errors.dueDate = "Due date can't be in the past.";

  if (STATUSES.indexOf(data.status) === -1) errors.status = "Choose a status.";
  return errors;
}

function resetForm() {
  const form = document.getElementById("taskForm");
  form.reset();
  fieldEl("priority").value = "Medium";
  fieldEl("status").value = "Backlog";
  clearFormErrors();
}

function openModal() {
  const modal = document.getElementById("addTaskModal");
  fieldEl("dueDate").min = todayISO();   // refresh in case the page stayed open past midnight
  modal.showModal();
  fieldEl("title").focus();
}

function closeModal() {
  document.getElementById("addTaskModal").close();
}

async function handleSubmit(e) {
  e.preventDefault();
  const submitBtn = document.getElementById("submitTask");
  if (submitBtn.disabled) return;

  const data = readForm();
  const errors = validateForm(data);
  clearFormErrors();
  const invalid = Object.keys(errors);
  if (invalid.length) {
    invalid.forEach(function (n) { setFieldError(n, errors[n]); });
    fieldEl(invalid[0]).focus();
    return;
  }

  // Optimistic UI: the card goes on the board straight away
  const task = addTask(data);
  resetForm();
  showToast(task.id + " added to " + task.status, "success");
  fieldEl("title").focus();

  // Email notification runs alongside. A failure never removes the card.
  submitBtn.disabled = true;
  submitBtn.textContent = "Sending…";
  try {
    await notifyNewTask(task);
  } catch (err) {
    console.warn(err);
    showToast("Card added locally — email notification failed", "warn");
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Add Task";
  }
}

function bindForm() {
  fillSelect(fieldEl("project"), PROJECTS);
  fillSelect(fieldEl("category"), CATEGORIES);
  fillSelect(fieldEl("priority"), PRIORITIES, "Medium");
  fillSelect(fieldEl("status"), STATUSES, "Backlog");
  // Placeholder options for project/category so a choice is deliberate
  fieldEl("project").insertAdjacentHTML("afterbegin", '<option value="" selected>Select a project…</option>');
  fieldEl("category").insertAdjacentHTML("afterbegin", '<option value="" selected>Select a category…</option>');

  const modal = document.getElementById("addTaskModal");
  const opener = document.getElementById("openAddTask");
  opener.addEventListener("click", openModal);
  document.getElementById("closeAddTask").addEventListener("click", closeModal);
  document.getElementById("cancelAddTask").addEventListener("click", closeModal);
  modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); }); // backdrop
  modal.addEventListener("close", function () { clearFormErrors(); opener.focus(); });

  document.getElementById("taskForm").addEventListener("submit", handleSubmit);

  // Clear a field's error as soon as the user edits it
  FIELDS.forEach(function (n) {
    const el = fieldEl(n);
    el.addEventListener(el.tagName === "SELECT" ? "change" : "input", function () {
      if (el.hasAttribute("aria-invalid")) setFieldError(n, "");
    });
  });
}

/* =========================================================
   FORMSUBMIT: email notification for a new task
   (only contacts FORMSUBMIT_ENDPOINT; no other network calls)
   ========================================================= */
async function notifyNewTask(task) {
  const res = await fetch(FORMSUBMIT_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({
      _subject: NOTIFY_SUBJECT_TAG + " New task " + task.id + ": " + task.title,
      _template: "table",
      _captcha: "false",
      "Task ID": task.id,
      Title: task.title,
      Description: task.description,
      Project: task.project,
      Category: task.category,
      Assignee: task.assignee,
      Priority: task.priority,
      "Due Date": task.dueDate,
      Status: task.status,
      "Submitted At": new Date().toISOString()
    })
  });
  if (!res.ok) throw new Error("FormSubmit failed: " + res.status);
  const json = await res.json();
  // FormSubmit can return HTTP 200 with success:"false" (e.g. not yet activated)
  if (json && String(json.success) === "false") {
    throw new Error("FormSubmit rejected: " + (json.message || "unknown reason"));
  }
  return json;
}

/* =========================================================
   TOASTS: transient, non-blocking messages
   ========================================================= */
function showToast(message, type) {
  const region = document.getElementById("toastRegion");
  const toast = document.createElement("div");
  toast.className = "toast toast-" + (type || "info");
  toast.textContent = message;          // textContent, so it's never parsed as HTML
  region.appendChild(toast);
  setTimeout(function () { toast.remove(); }, TOAST_DURATION_MS);
}

/* =========================================================
   INIT
   ========================================================= */
function init() {
  seedTasks();
  bindFilters();
  bindForm();
  bindDragAndDrop();
  const board = document.getElementById("board");
  board.addEventListener("click", handleBoardClick);
  board.addEventListener("keydown", handleBoardKeydown);
  fieldEl("dueDate").min = todayISO();
  renderBoard();
}

document.addEventListener("DOMContentLoaded", init);
</script>
